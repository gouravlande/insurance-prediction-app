<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Insurance Charges Predictor</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <!-- LEFT SECTION -->
        <div class="left-section">

            <h1>
                Insurance Charges Predictor
            </h1>

            <p>
                AI-powered medical insurance prediction platform built using
                Machine Learning, FastAPI, and Linear Regression.
            </p>

        </div>


        <!-- RIGHT SECTION -->
        <div class="form-section">

            <form action="/predict_form" method="post">


                <!-- AGE -->
                <div class="input-group">

                    <label>Age</label>

                    <input
                        type="number"
                        step="any"
                        name="age"
                        placeholder="Enter your age"
                        required
                    >

                </div>


                <!-- GENDER -->
                <div class="input-group">

                    <label>Gender</label>

                    <select name="is_female" required>

                        <option value="">Select Gender</option>

                        <option value="1">Female</option>

                        <option value="0">Male</option>

                    </select>

                </div>


                <!-- BMI -->
                <div class="input-group">

                    <label>BMI</label>

                    <input
                        type="number"
                        step="any"
                        name="bmi"
                        placeholder="Enter BMI"
                        required
                    >

                </div>


                <!-- CHILDREN -->
                <div class="input-group">

                    <label>Children</label>

                    <input
                        type="number"
                        step="any"
                        name="children"
                        placeholder="Number of children"
                        required
                    >

                </div>


                <!-- SMOKER -->
                <div class="input-group">

                    <label>Smoking Status</label>

                    <select name="is_smoker" required>

                        <option value="">Select Option</option>

                        <option value="1">Smoker</option>

                        <option value="0">Non-Smoker</option>

                    </select>

                </div>


                <!-- REGION -->
                <div class="input-group">

                    <label>Region</label>

                    <select name="region_southeast" required>

                        <option value="">Select Region</option>

                        <option value="1">Southeast</option>

                        <option value="0">Other Region</option>

                    </select>

                </div>


                <!-- OBESITY -->
                <div class="input-group">

                    <label>Obesity Status</label>

                    <select name="bmi_category_obese" required>

                        <option value="">Select Option</option>

                        <option value="1">Obese</option>

                        <option value="0">Not Obese</option>

                    </select>

                </div>


                <!-- BUTTONS -->
                <div class="button-group">

                    <button type="submit" class="predict-btn">

                        Predict Charges

                    </button>


                    <button type="reset" class="clear-btn">

                        Clear Form

                    </button>

                </div>

            </form>


            <!-- RESULT -->
            {% if prediction %}

            <div class="result-box">

                <h2>Predicted Insurance Charges</h2>

                <h1>₹ {{ prediction }}</h1>

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
